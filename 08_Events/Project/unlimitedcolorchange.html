    // how to create color 
    const colors = function(){
      let Hex = "0123456789ABCDEF";
      let color = "#";

        color += Hex[Math.floor(Math.random()*16)]
      }
      return color;

      col = setInterval(function(){
         document.body.style.backgroundColor = colors();

    stop.addEventListener("click", function(){
       clearInterval(col)
